{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <time>{{ .Date.Format "2006-01-02" }}</time>
  <div class="content">
    {{ .Content }}
  </div>

  {{ if .Params.attachments }}
  <div class="attachments">
    <h3>첨부파일</h3>
    <ul>
      {{ range .Params.attachments }}
      <li><a href="{{ .file | absURL }}" download>{{ .name }}</a></li>
      {{ end }}
    </ul>
  </div>
  {{ end }}
</article>
{{ end }}
